<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Hi, Siswa</h1>
            <h2>Silahkan Masukkan Data</h2>
        </div>
        <div class="nama-nilai">
            <label for="nama" class="input-nama">Nama </label>
            <input type="text" id="nama" placeholder="Masukkan Nama Kamu...">
        </div>
        <div class="nama-nilai">
            <label for="Nilai" class="input-nilai">Nilai </label>
            <input type="number" id="nilai" min="0" max="100" placeholder="Masukkan Nilai Kamu...">
        </div>

        <button class="btn-proses" onclick="prosesNilai()">Cek Nilai</button>
        <div class="Hasil">Hasil</div>
        <div class="Hasil-Input" id="HasilInput">
            <div class="HasilSemua">
                <p class="NamaHasil" id="namaHasil">Nama Siswa</p>
                <div><strong>Nilai: </strong> <span id="Nilai">0</span></div>
                <div><strong>Grade: </strong> <span id="Grade">-</span></div> 
                <div class="status" id="Status">-</div>
            </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
